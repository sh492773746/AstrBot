name: AstrBot Dashboard CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install and Build
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          node --test tests/*.test.mjs scripts/build-wangshangliao-guide.test.mjs
          pnpm run build

      - name: Inject Commit SHA
        id: get_sha
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          test "$COMMIT_SHA" = "$GITHUB_SHA"
          echo "COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"
          mkdir -p dashboard/dist/assets
          printf '%s\n' "$COMMIT_SHA" > dashboard/dist/assets/version
          cd dashboard
          zip -r dist.zip dist

      - name: Archive production artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-without-markdown
          path: |
            dashboard/dist
            !dist/**/*.md

      - name: Assemble credential-free application bundle
        run: |
          mkdir -p delivery/source
          git archive HEAD | tar -x -C delivery/source
          mkdir -p delivery/source/astrbot/dashboard
          cp -R dashboard/dist delivery/source/astrbot/dashboard/dist
          cp astrbot/builtin_stars/wangshangliao_moderation/pages/management/index.html \
            delivery/source/astrbot/builtin_stars/wangshangliao_moderation/pages/management/index.html
          printf '%s\n' "$GITHUB_SHA" > delivery/source/BUILD_COMMIT
          test "$(cat delivery/source/BUILD_COMMIT)" = \
            "$(cat delivery/source/astrbot/dashboard/dist/assets/version)"
          tar -czf "delivery/astrbot-${GITHUB_SHA}.tar.gz" -C delivery/source .
          cd delivery
          sha256sum "astrbot-${GITHUB_SHA}.tar.gz" > SHA256SUMS

      - name: Deliver reproducible application sources and Dashboard
        uses: actions/upload-artifact@v7
        with:
          name: astrbot-application-${{ github.sha }}
          path: |
            delivery/astrbot-*.tar.gz
            delivery/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.repository == 'AstrBotDevs/AstrBot' && github.event_name == 'push'
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: release-${{ github.sha }}
          owner: AstrBotDevs
          repo: astrbot-release-harbour
          body: "Automated release from commit ${{ github.sha }}"
          token: ${{ secrets.ASTRBOT_HARBOUR_TOKEN }}
          artifacts: "dashboard/dist.zip"
