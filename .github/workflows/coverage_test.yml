name: Run tests and upload coverage

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      
      - name: Install dependencies
        run: |
          uv sync --locked --dev --extra wsl
          uv run python -m playwright install --with-deps chromium --only-shell

      - name: Prepare native Linux sandbox tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true

      - name: Run tests
        timeout-minutes: 70
        shell: bash
        run: |
          mkdir -p data/plugins
          mkdir -p data/config
          mkdir -p data/temp
          export TESTING=true
          # Offline diagnostics must never receive live model credentials.
          export OPENAI_API_KEY=""
          export ZHIPU_API_KEY=""
          unit="wsl-coverage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            free -m
            df -h .
          } > coverage-resources.log
          status=0
          # Keep the hosted runner outside the test memory/process boundary.
          # Regular-file output cannot be held open by detached test children.
          sudo systemd-run --wait --pipe --collect --unit="$unit" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property="WorkingDirectory=$GITHUB_WORKSPACE" \
            --property=MemoryMax=4G --property=MemorySwapMax=0 \
            --property=RuntimeMaxSec=65m --property=TimeoutStopSec=15s \
            --property=KillMode=control-group \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv="LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            --setenv=CI=true --setenv=GITHUB_ACTIONS=true \
            --setenv="GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            --setenv="GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            --setenv="GITHUB_REF=$GITHUB_REF" --setenv="GITHUB_SHA=$GITHUB_SHA" \
            --setenv="GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME" \
            --setenv="RUNNER_OS=$RUNNER_OS" --setenv="RUNNER_TEMP=$RUNNER_TEMP" \
            --setenv=TESTING=true --setenv=ASTRBOT_TEST_MODE=true \
            --setenv=ASTRBOT_DISABLE_FILE_LOGGING=1 --setenv=PYTHONUTF8=1 \
            --setenv="OPENAI_API_KEY=" --setenv="ZHIPU_API_KEY=" \
            "$GITHUB_WORKSPACE/.venv/bin/python" -u - \
            > coverage-test.log 2>&1 <<'PY' &
          import os
          import sys

          import pytest

          result = int(pytest.main([
              "tests", "--cov=astrbot", "--cov-report=xml", "-v",
              "--durations=25", "-o", "log_cli=false",
              "-o", "faulthandler_timeout=120",
          ]))
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(result)
          PY
          service_pid=$!
          while kill -0 "$service_pid" 2>/dev/null; do
            sleep 30
            tail -n 8 coverage-test.log
          done
          wait "$service_pid" || status=$?
          sudo journalctl -u "$unit" --no-pager -n 80 >> coverage-resources.log || true
          cat coverage-test.log
          cat coverage-resources.log
          exit "$status"

      - name: Archive coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage-test.log
            coverage-resources.log
          if-no-files-found: warn

      - name: Upload results to Codecov
        if: github.repository == 'AstrBotDevs/AstrBot'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
