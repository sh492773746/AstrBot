name: Run tests and upload coverage

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock
      
      - name: Install dependencies
        run: |
          uv sync --locked --dev --extra wsl
          uv run python -m playwright install --with-deps chromium --only-shell

      - name: Run tests
        timeout-minutes: 70
        shell: bash
        run: |
          mkdir -p data/plugins
          mkdir -p data/config
          mkdir -p data/temp
          export TESTING=true
          # Offline diagnostics must never receive live model credentials.
          export OPENAI_API_KEY=""
          export ZHIPU_API_KEY=""
          # Keep time to archive diagnostics even if the instrumented suite stalls.
          timeout --signal=TERM --kill-after=30s 65m \
            uv run python -u - <<'PY' 2>&1 | tee coverage-test.log
          import os
          import sys

          import pytest

          result = int(pytest.main([
              "tests", "--cov=astrbot", "--cov-report=xml", "-v",
              "--durations=25", "-o", "log_cli=false",
              "-o", "faulthandler_timeout=120",
          ]))
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(result)
          PY

      - name: Archive coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage.xml
            coverage-test.log
          if-no-files-found: warn

      - name: Upload results to Codecov
        if: github.repository == 'AstrBotDevs/AstrBot'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
