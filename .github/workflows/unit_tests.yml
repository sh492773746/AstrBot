name: Unit Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run pytest suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 55 || matrix.os == 'macos-15-intel' && 60 || 45 }}
    env:
      PYTHONUTF8: "1"
      ASTRBOT_CI_TEST_TIMEOUT_SECONDS: ${{ matrix.os == 'windows-latest' && '2400' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        # Keep macOS coverage without depending on the constrained arm64 pool.
        os: [ubuntu-latest, windows-latest, macos-15-intel]

    # The Windows lane stays best-effort for now: the suite still has
    # pre-existing Windows-specific failures there. Promote to blocking
    # once those tests are fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    defaults:
      run:
        # Windows runners default to pwsh; use bash so the same steps and
        # test script work on all three platforms.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Enable and verify Linux sandbox execution
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's AppArmor policy blocks user-namespace capabilities by default.
          # Allow them on this ephemeral runner so the real sandbox tests can run.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true

      - name: Verify macOS sandbox dependency
        if: runner.os == 'macOS'
        run: test -x /usr/bin/sandbox-exec

      - name: Run tests
        run: |
          chmod +x scripts/run_pytests_ci.sh
          # Preserve the existing best-effort Windows lane, but report the first
          # real failure instead of cancelling the entire workflow after 45 min.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bash ./scripts/run_pytests_ci.sh ./tests --maxfail=1 --durations=25 -o faulthandler_timeout=120
          else
            bash ./scripts/run_pytests_ci.sh ./tests --durations=25 -o faulthandler_timeout=120
          fi
