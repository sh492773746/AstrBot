name: Unit Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README*.md'
      - 'changelogs/**'
      - 'dashboard/**'
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run pytest suite (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 55 || matrix.os == 'macos-15-intel' && 60 || 45 }}
    env:
      PYTHONUTF8: "1"
      ASTRBOT_CI_TEST_TIMEOUT_SECONDS: "2400"
      ASTRBOT_CI_SHARD_INDEX: ${{ matrix.shard }}
      ASTRBOT_CI_SHARD_COUNT: "4"
    strategy:
      fail-fast: false
      matrix:
        # Keep macOS coverage without depending on the constrained arm64 pool.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        shard: [0, 1, 2, 3]

    defaults:
      run:
        # Windows runners default to pwsh; use bash so the same steps and
        # test script work on all three platforms.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Linux sandbox dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Set up Go for the managed protocol worker
        if: runner.os != 'Windows'
        uses: actions/setup-go@v6
        with:
          go-version-file: services/lajiaoliao-bridge/go.mod
          cache-dependency-path: services/lajiaoliao-bridge/go.sum

      - name: Build the offline LajiaoLiao test worker
        if: runner.os != 'Windows'
        run: python services/lajiaoliao-bridge/build_plugin.py --worker-only

      - name: Enable and verify Linux sandbox execution
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's AppArmor policy blocks user-namespace capabilities by default.
          # Allow them on this ephemeral runner so the real sandbox tests can run.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / /bin/true

      - name: Verify macOS sandbox dependency
        if: runner.os == 'macOS'
        run: test -x /usr/bin/sandbox-exec

      - name: Run tests
        run: |
          chmod +x scripts/run_pytests_ci.sh
          mkdir -p ci-results
          bash ./scripts/run_pytests_ci.sh ./tests --durations=25 -o faulthandler_timeout=120 2>&1 | tee ci-results/pytest.log

      - name: Archive test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-${{ matrix.shard }}-${{ github.sha }}
          path: ci-results/
          if-no-files-found: error

  verify:
    name: Verify complete test collection (${{ matrix.os }})
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: tests-${{ matrix.os }}-*-${{ github.sha }}
          path: test-parts
      - name: Verify all cases ran in exactly one shard
        run: python scripts/verify_ci_shards.py test-parts
