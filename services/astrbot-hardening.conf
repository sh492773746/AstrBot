[Service]
User=astrbot
Group=astrbot
UMask=0077
Environment=HOME=/var/lib/astrbot
Environment=XDG_CACHE_HOME=/var/lib/astrbot/cache
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=PATH=/opt/astrbot-prod/.venv/bin:/usr/local/bin:/usr/bin:/bin
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
RestrictSUIDSGID=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ReadWritePaths=/opt/astrbot-prod/data /var/lib/astrbot
ReadOnlyPaths=/opt/astrbot-prod/data/plugins
InaccessiblePaths=/opt/backups
CPUQuota=200%
MemoryHigh=1G
MemoryMax=2G
TasksMax=256
