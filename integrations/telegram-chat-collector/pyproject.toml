[project]
name = "telegram-chat-collector"
version = "0.2.0"
description = "Independent Telegram activity collector with an authenticated local API"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.45,<2",
 "aiohttp>=3.10,<4",
 "filelock>=3.16,<4",
 "python-socks[asyncio]>=2.5,<3",
 "tzdata>=2024.1",
 "regex>=2024.11.6",
]

[project.scripts]
tg-collector = "collector.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-aiohttp>=1,<2", "ruff>=0.15,<0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
