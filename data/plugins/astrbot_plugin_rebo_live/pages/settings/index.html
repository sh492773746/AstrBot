<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>热播 Live</title>
<style>body{font:16px system-ui;margin:24px auto;padding:0 20px;max-width:860px;color:#243348;background:#f5f7fb}section{background:white;padding:22px;border-radius:16px;margin-bottom:16px}input,textarea,button{font:inherit;padding:10px;margin:6px;border:1px solid #d8dfea;border-radius:8px}button{cursor:pointer;background:#eef4ff}textarea{display:block;width:90%;height:70px}#notice{white-space:pre-wrap}small{color:#65748b}</style>
<h1>📺 热播 Live</h1>
<p id="page-state" role="status" aria-live="polite">⏳ 正在初始化页面与 WebUI 授权连接…若长时间不变，请重新加载。</p>
<button id="reload-page" onclick="location.reload()">重新加载页面（不重新登录账号）</button>
<noscript>⚠️ JavaScript 未启用，无法操作插件。请启用脚本后刷新。</noscript>
<fieldset id="controls" disabled style="border:0;padding:0;margin:0">
<section><h2>账号登录</h2><input id="phone" placeholder="手机号" autocomplete="username"><input id="password" type="password" placeholder="密码" autocomplete="off"><label><input id="remember" type="checkbox">记住密码（仅服务器保存）</label><br><button id="login">登录</button><button id="relogin">重新登录</button><button id="logout">退出并清除凭据</button><p id="account">尚未读取登录状态</p><small>不会发送入场消息。房间默认暂停，启用后等待完整间隔再发送。</small></section><p id="notice" role="status"></p><section><h2>直播间</h2><button id="refresh">获取可见直播间</button><button id="status">刷新状态</button><div id="rooms"></div></section>
</fieldset><script src="./bootstrap.js"></script><script type="module" src="./app.js"></script></html>
