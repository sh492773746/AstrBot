<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram 采集管理</title>
<style>
:root{color-scheme:light dark;--bg:#f5f7fa;--panel:#fff;--text:#243247;--muted:#64748b;--line:#dce2ea;--accent:#245dc1}*{box-sizing:border-box}body{margin:0;padding:28px;font:14px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1200px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:24px;margin:0}h2{font-size:18px;margin-top:0}p{color:var(--muted)}nav{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);padding:9px 12px}button{cursor:pointer}button:hover,button[aria-selected=true]{border-color:var(--accent);color:var(--accent)}button:disabled{opacity:.5;cursor:wait}section,.notice{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}.toolbar,form{display:flex;align-items:end;flex-wrap:wrap;gap:12px}label{display:grid;gap:5px}input{min-width:200px}textarea{width:100%;min-height:85px}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}.scroll{overflow:auto}.muted,small{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.error{color:#bd3636}#notice:empty{display:none}.status{font-weight:600}dialog{max-width:560px;width:95%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:24px}dialog::backdrop{background:#0007}pre{white-space:pre-wrap;word-break:break-word}a{color:var(--accent)}@media(prefers-color-scheme:dark){:root{--bg:#171c24;--panel:#222a35;--text:#e5eaf1;--muted:#aab6c7;--line:#3b4657;--accent:#90b7ff}}@media(max-width:640px){body{padding:14px}header{align-items:start}td,th{padding:8px}input{min-width:0;width:100%}label{width:100%}}
</style></head><body><main><header><div><h1>Telegram 采集管理</h1><p>账号连接统一管理，业务订阅独立运行。</p></div><button id="refresh">刷新状态</button></header><nav aria-label="采集管理导航"><button data-tab="subscriptions" aria-selected="true">订阅</button><button data-tab="accounts">账号</button><button data-tab="modules">模块</button><button data-tab="status">运行状态</button></nav><div id="notice" class="notice" role="status"></div><div id="content">正在加载…</div></main><dialog id="confirm"><h2>确认加入群聊</h2><p id="confirmtext"></p><div class="actions"><button id="confirmyes">使用此账号加入</button><button id="confirmno">取消</button></div></dialog>
<script>
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={active:'运行',connected:'在线',backfilling:'历史补采中',ready:'就绪，等待选择时长',paused:'已暂停',expired:'已到期',pending_approval:'等待审批',starting:'启动中',connecting:'连接中',login_required:'需要本机登录',flood_wait:'Telegram 限流',connection_error:'连接异常'};
let tab='subscriptions',items=[],accounts=[],confirmData=null,busy=false;
function notice(text,error=false){$('#notice').textContent=text;$('#notice').className='notice'+(error?' error':'');}
async function api(resource,method='GET',data){return AstrBotPluginPage.apiPost('control',{resource,method,data,request_id:crypto.randomUUID()});}
function date(v){return v?new Date(v*1000).toLocaleString():'未同步';}
async function perform(fn){if(busy)return;busy=true;try{await fn();}catch(e){notice(e.message||'操作失败',true);}finally{busy=false;}}
async function load(){const [a,s]=await Promise.all([api('accounts'),api('subscriptions')]);accounts=a.items;items=s.items;
 if(tab==='subscriptions'){
 $('#content').innerHTML=`<section><h2>添加监控订阅</h2><form id="add"><label>采集账号<select name="account_id">${accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} · ${esc(labels[a.state]||a.state)}</option>`).join('')}</select></label><label>业务模块<select name="module"><option value="activity">人员发言与链接统计</option><option value="keywords">关键词监控</option></select></label><label>群链接<input name="link" placeholder="https://t.me/群用户名" required></label><button>检查并配置</button></form><p>公开群优先免入群访问。必须加入时会请求确认。人员统计还需配置监控人员。</p></section><section><h2>监控订阅 · ${items.length}</h2><div class="scroll"><table><thead><tr><th>群 / 账号</th><th>模块</th><th>状态</th><th>进度</th><th>操作</th></tr></thead><tbody>${items.map((s,i)=>`<tr><td>${esc(s.name)}<br><small>${esc(s.group_id)} · ${esc(s.account_id)}</small></td><td>${s.module==='activity'?'人员统计':'关键词'}</td><td class="status">${esc(labels[s.state]||s.state)}${s.error?`<br><span class="error">${esc(s.error)}</span>`:''}</td><td>${date(s.last_sync)}${s.end?`<br><small>截止 ${date(s.end)}</small>`:''}</td><td><div class="actions"><button data-action="${s.state==='active'?'pause':'resume'}" data-index="${i}">${s.state==='active'?'暂停':'启用'}</button><button data-action="configure" data-index="${i}">${s.module==='activity'?'人员配置':'关键词规则'}</button></div></td></tr>`).join('')||'<tr><td colspan="5">暂无订阅，请先添加监控群。</td></tr>'}</tbody></table></div></section>`;
 $('#add').onsubmit=e=>{e.preventDefault();perform(async()=>{const data=Object.fromEntries(new FormData(e.target));const result=await api('join/prepare','POST',data);if(result.confirmation_id){confirmData={...data,confirmation_id:result.confirmation_id};$('#confirmtext').textContent=`账号 ${accounts.find(a=>a.id===data.account_id)?.name} 将加入 ${data.link}。是否继续？`;$('#confirm').showModal();}else{notice(result.message||'群已配置，请继续配置人员或等待历史补采。');await load();}});};
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>perform(async()=>{const s=items[Number(b.dataset.index)],action=b.dataset.action;let data={id:s.id,module:s.module,account_id:s.account_id,action};if(action==='configure'){if(s.module==='keywords'){const pattern=prompt('输入关键词正则表达式（修改仅影响后续处理，不重算已发送记录）',s.config.pattern||'');if(pattern===null)return;if(!pattern.trim()){notice('请输入规则，或保留原有默认规则。',true);return;}data.config={pattern};}else{await activity(s);return;}}else if(action==='resume'&&s.module==='keywords'){const days=Number(prompt('持续监控天数：1、2 或 3','3'));if(![1,2,3].includes(days))return;data.days=days;}await api('subscriptions','POST',data);notice('设置已保存');await load();}));
 }else if(tab==='accounts'){$('#content').innerHTML=`<section><h2>采集账号</h2><table><tr><th>账号</th><th>Telegram ID</th><th>状态</th><th>限流等待</th></tr>${accounts.map(a=>`<tr><td>${esc(a.name)}<br><small>${esc(a.id)}</small></td><td>${esc(a.user_id||'未核验')}</td><td>${esc(labels[a.state]||a.state)}</td><td>${a.retry_at?date(a.retry_at):'无'}</td></tr>`).join('')}</table><p>账号登录、验证码及两步验证仅在服务器本地处理。同一账号只保留一个活动客户端。新增账号需本地配置会话后重启服务。</p></section>`;
 }else if(tab==='modules'){const d=await api('modules');$('#content').innerHTML=d.items.map(m=>`<section><h2>${esc(m.name)}</h2><p>${esc(m.description)}</p><small>模块标识：${esc(m.id)}</small></section>`).join('')+'<p>新模块通过代码注册接入统一消息接口，部署后在此显示，不支持上传执行任意代码。</p>';
 }else{const d=await api('status');$('#content').innerHTML=`<section><h2>持久任务队列</h2><p>${esc([d.error,...Object.entries(d.module_errors||{}).map(([k,v])=>k+': '+v),...(d.failed_tasks||[])].filter(Boolean).join('；')||'未报告服务级错误')}</p><table><tr><th>订阅</th><th>待处理</th><th>重试次数</th><th>错误</th></tr>${d.queue.map(q=>`<tr><td>${esc(items.find(s=>s.id===q.subscription_id)?.name||q.subscription_id)}</td><td>${q.pending}</td><td>${q.attempts}</td><td>${esc(q.error||'无')}</td></tr>`).join('')||'<tr><td colspan="4">队列已清空</td></tr>'}</table></section><section><h2>采集缺口</h2>${d.gaps.map(g=>`<p>${esc(items.find(s=>s.id===g.subscription_id)?.name||g.account_id)} · ${date(g.started)} · ${esc(g.reason)} · ${g.ended?'已恢复，历史仍可能不完整':'待恢复'}</p>`).join('')||'<p>暂无已记录缺口</p>'}</section><section><h2>入群审批</h2>${(d.join_requests||[]).map(r=>`<p>${esc(r.account_id)} · ${esc(r.link)} · ${r.state==='approval'?'等待群管理员批准':'已提交，正在核验结果'}</p>`).join('')||'<p>暂无待处理入群申请</p>'}</section>`;}}
async function activity(s){const call=(resource,method='GET',data={},query={})=>api('activity','POST',{module:'activity',account_id:s.account_id,resource,method,data,query});const watches=await call('watches','GET',{}, {group:s.group_id});$('#content').innerHTML=`<section><h2>${esc(s.name)} · 监控人员</h2><p>人员仅在所选群内监控。首次添加从当前时刻起算。</p><form id="person"><label>Telegram 数字 ID<input name="person" inputmode="numeric" required></label><label>显示名称<input name="name" required></label><button>添加本群人员</button></form><div id="watches"></div><button id="back">返回订阅</button></section>`;const list=watches.items||[];$('#watches').innerHTML=list.map((w,i)=>`<p>${esc(w.person_name||w.user_id)} · ${w.enabled?'启用':'暂停'} <button data-watch="${i}">${w.enabled?'暂停':'恢复'}</button></p>`).join('');document.querySelectorAll('[data-watch]').forEach(b=>b.onclick=()=>perform(async()=>{const w=list[Number(b.dataset.watch)];await call('watches','PUT',{group:s.group_id,person:w.user_id,enabled:!w.enabled});await activity(s);}));$('#back').onclick=()=>perform(load);$('#person').onsubmit=e=>{e.preventDefault();perform(async()=>{const d=Object.fromEntries(new FormData(e.target)),id=Number(d.person);if(!Number.isSafeInteger(id)||id<=0)throw Error('请输入有效数字 ID');await call('people','PUT',{id,name:d.name,enabled:true});await call('watches','PUT',{group:s.group_id,person:id,enabled:true});notice('本群监控人员已添加');await activity(s);});};}
$('#confirmno').onclick=()=>$('#confirm').close();$('#confirmyes').onclick=()=>perform(async()=>{const result=await api('join/confirm','POST',confirmData);$('#confirm').close();notice(result.message||'入群操作已提交，请检查订阅状态');await load();});$('#refresh').onclick=()=>perform(load);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(n=>n.setAttribute('aria-selected',n===b));perform(load);});window.addEventListener('DOMContentLoaded',()=>perform(async()=>{await AstrBotPluginPage.ready();await load();}));
</script></body></html>
